name: Build Matrix Wallpaper APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Files
        run: |
          mkdir -p app/src/main/java/com/example/matrixcity app/src/main/res/xml app/src/main/res/values app/src/main/res/drawable
          echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' > settings.gradle
          echo 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' >> settings.gradle
          echo 'include ":app"' >> settings.gradle
          echo 'plugins { id "com.android.application" version "8.2.2" apply false; id "org.jetbrains.kotlin.android" version "1.9.22" apply false }' > build.gradle
          echo 'android.useAndroidX=true' > gradle.properties
          echo 'plugins { id "com.android.application"; id "org.jetbrains.kotlin.android" }' > app/build.gradle
          echo 'android { namespace "com.example.matrixcity"; compileSdk 34; defaultConfig { applicationId "com.example.matrixcity"; minSdk 26; targetSdk 34; versionCode 3; versionName "1.2" }; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = "17" } }' >> app/build.gradle
          echo "" | base64 -d > app/src/main/AndroidManifest.xml
          echo "PHdhbGxwYXBlciB4bWxuczphbmRyb2lkPSJodHRwOi8vc2NoZW1hcy5hbmRyb2lkLmNvbS9hcGsvcmVzL2FuZHJvaWQiIGFuZHJvaWQ6dGh1bWJuYWlsPSJAZHJhd2FibGUvd2FsbHBhcGVyX3RodW1ibmFpbCIgLz4=" | base64 -d > app/src/main/res/xml/wallpaper.xml
          echo "PHJlc291cmNlcz48c3RyaW5nIG5hbWU9ImFwcF9uYW1lIj5NYXRyaXggQ2l0eTwvc3RyaW5nPjwvcmVzb3VyY2VzPg==" | base64 -d > app/src/main/res/values/strings.xml
          echo "PHNoYXBlIHhtbG5zOmFuZHJvaWQ9Imh0dHA6Ly9zY2hlbWFzLmFuZHJvaWQuY29tL2Fway9yZXMvYW5kcm9pZCI+PHNvbGlkIGFuZHJvaWQ6Y29sb3I9IiMwMDNCMDAiLz48c3Ryb2tlIGFuZHJvaWQ6d2lkdGg9IjRkcCIgYW5kcm9pZDpjb2xvcj0iIzAwRkY0MSIvPjwvc2hhcGU+" | base64 -d > app/src/main/res/drawable/wallpaper_thumbnail.xml
          printf 'package com.example.matrixcity\nimport android.app.*\nimport android.content.*\nimport android.os.Bundle\nclass MainActivity : Activity() {\n override fun onCreate(b: Bundle?) {\n  super.onCreate(b)\n  try {\n   startActivity(Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER).putExtra(WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT, ComponentName(this, MatrixCityWallpaperService::class.java)))\n  } catch (e: Exception) {\n   startActivity(Intent(WallpaperManager.ACTION_LIVE_WALLPAPER_CHOOSER))\n  }\n  finish()\n }\n}\n' > app/src/main/java/com/example/matrixcity/MainActivity.kt
          printf 'package com.example.matrixcity\nimport android.graphics.*\nimport android.os.*\nimport android.service.wallpaper.WallpaperService\nimport android.view.SurfaceHolder\nimport kotlin.random.Random\nclass MatrixCityWallpaperService : WallpaperService() {\n override fun onCreateEngine(): Engine = MatrixEngine()\n inner class MatrixEngine : Engine() {\n  private val h = Handler(Looper.getMainLooper())\n  private var vis = false; private var w = 0; private var ht = 0; private val sz = 28f\n  private var drops = FloatArray(0); private var speeds = FloatArray(0)\n  private var bgB = FloatArray(0); private var fgB = FloatArray(0); private var spires = BooleanArray(0)\n  private val chars = "ｦｱｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789"\n  private val pHead = Paint().apply { color = Color.parseColor("#E8FFE8"); textSize = 28f; typeface = Typeface.MONOSPACE; isFakeBoldText = true; setShadowLayer(12f, 0f, 0f, Color.parseColor("#00FF41")) }\n  private val pBody = Paint().apply { color = Color.parseColor("#00FF41"); textSize = 28f; typeface = Typeface.MONOSPACE }\n  private val pDim = Paint().apply { color = Color.parseColor("#005518"); textSize = 28f; typeface = Typeface.MONOSPACE }\n  private val pFade = Paint().apply { color = Color.argb(26, 0, 4, 0) }\n  private val pBgCity = Paint().apply { color = Color.parseColor("#041408") }\n  private val pFgCity = Paint().apply { color = Color.parseColor("#020703") }\n  private val pEdge = Paint().apply { color = Color.parseColor("#00AA2B"); strokeWidth = 2f; style = Paint.Style.STROKE }\n  private val pWin = Paint().apply { color = Color.parseColor("#00E639") }\n  private val pBeacon = Paint().apply { color = Color.parseColor("#FF2A55"); setShadowLayer(8f, 0f, 0f, Color.RED) }\n  private val run = object : Runnable { override fun run() { draw(); if (vis) h.postDelayed(this, 35L) } }\n  override fun onSurfaceChanged(holder: SurfaceHolder, f: Int, w: Int, ht: Int) {\n   super.onSurfaceChanged(holder, f, w, ht); this.w = w; this.ht = ht\n   val cols = (w / sz).toInt().coerceAtLeast(1)\n   drops = FloatArray(cols) { Random.nextFloat() * -40f }\n   speeds = FloatArray(cols) { 0.45f + Random.nextFloat() * 0.75f }\n   bgB = FloatArray(22) { ht * (0.14f + Random.nextFloat() * 0.24f) }\n   fgB = FloatArray(12) { ht * (0.08f + Random.nextFloat() * 0.20f) }\n   spires = BooleanArray(12) { Random.nextBoolean() }\n  }\n  override fun onVisibilityChanged(v: Boolean) { super.onVisibilityChanged(v); vis = v; if (v) h.post(run) else h.removeCallbacks(run) }\n  override fun onSurfaceDestroyed(holder: SurfaceHolder) { super.onSurfaceDestroyed(holder); vis = false; h.removeCallbacks(run) }\n  private fun draw() {\n   val c = surfaceHolder.lockCanvas() ?: return\n   try {\n    c.drawRect(0f, 0f, w.toFloat(), ht.toFloat(), pFade)\n    for (i in drops.indices) {\n     val x = i * sz; val y = drops[i] * sz\n     if (y > 0 && y < ht) {\n      c.drawText(chars.random().toString(), x, y, pHead)\n      if (drops[i] > 1f) c.drawText(chars.random().toString(), x, (drops[i] - 1f) * sz, pBody)\n      if (drops[i] > 4f && Random.nextFloat() > 0.5f) c.drawText(chars.random().toString(), x, (drops[i] - 4f) * sz, pDim)\n     }\n     if (y > ht && Random.nextFloat() > 0.97f) { drops[i] = 0f; speeds[i] = 0.45f + Random.nextFloat() * 0.75f }\n     drops[i] += speeds[i]\n    }\n    if (bgB.isNotEmpty()) {\n     val bw1 = w.toFloat() / 22\n     for (b in 0 until 22) { val l = b * bw1; val t = ht - bgB[b]; c.drawRect(l, t, l + bw1 - 2f, ht.toFloat(), pBgCity) }\n     val bw2 = w.toFloat() / 12\n     for (b in 0 until 12) {\n      val l = b * bw2 + 3f; val r = (b + 1) * bw2 - 3f; val t = ht - fgB[b]\n      c.drawRect(l, t, r, ht.toFloat(), pFgCity); c.drawLine(l, t, l, ht.toFloat(), pEdge); c.drawLine(l, t, r, t, pEdge)\n      if (spires[b]) { val mx = (l + r) / 2f; c.drawLine(mx, t, mx, t - 36f, pEdge); c.drawCircle(mx, t - 38f, 3f, pBeacon) }\n      var wy = t + 16f\n      while (wy < ht - 16f) {\n       var wx = l + 10f\n       while (wx < r - 12f) { if (((b * 7 + wy.toInt() + wx.toInt()) %% 5) == 0) c.drawRect(wx, wy, wx + 6f, wy + 10f, pWin); wx += 14f }\n       wy += 22f\n      }\n     }\n    }\n   } finally { surfaceHolder.unlockCanvasAndPost(c) }\n  }\n }\n}\n' > app/src/main/java/com/example/matrixcity/MatrixCityWallpaperService.kt
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.4' }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: MatrixCityLiveWallpaper-APK, path: app/build/outputs/apk/debug/app-debug.apk }
