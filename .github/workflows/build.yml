name: Build Matrix Wallpaper APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Files
        run: |
          mkdir -p app/src/main/java/com/example/matrix3d app/src/main/res/xml app/src/main/res/values app/src/main/res/drawable
          echo 'pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}};dependencyResolutionManagement{repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS);repositories{google();mavenCentral()}};include ":app"' > settings.gradle
          echo 'plugins{id "com.android.application" version "8.2.2" apply false;id "org.jetbrains.kotlin.android" version "1.9.22" apply false}' > build.gradle
          echo 'android.useAndroidX=true' > gradle.properties
          echo 'plugins{id "com.android.application";id "org.jetbrains.kotlin.android"};android{namespace "com.example.matrix3d";compileSdk 34;defaultConfig{applicationId "com.example.matrix3d";minSdk 26;targetSdk 34;versionCode 2;versionName "4.0"};compileOptions{sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17};kotlinOptions{jvmTarget="17"}};dependencies{implementation "androidx.core:core-ktx:1.12.0"}' > app/build.gradle
          echo "" | base64 -d > app/src/main/AndroidManifest.xml
          echo "PHdhbGxwYXBlciB4bWxuczphbmRyb2lkPSJodHRwOi8vc2NoZW1hcy5hbmRyb2lkLmNvbS9hcGsvcmVzL2FuZHJvaWQiIGFuZHJvaWQ6c2V0dGluZ3NBY3Rpdml0eT0iY29tLmV4YW1wbGUubWF0cml4M2QuTWFpbkFjdGl2aXR5IiBhbmRyb2lkOnRodW1ibmFpbD0iQGRyYXdhYmxlL3dhbGxwYXBlcl90aHVtYm5haWwiIC8+" | base64 -d > app/src/main/res/xml/wallpaper.xml
          echo "PHJlc291cmNlcz48c3RyaW5nIG5hbWU9ImFwcF9uYW1lIj5NYXRyaXggM0Q8L3N0cmluZz48L3Jlc291cmNlcz4=" | base64 -d > app/src/main/res/values/strings.xml
          echo "PHNoYXBlIHhtbG5zOmFuZHJvaWQ9Imh0dHA6Ly9zY2hlbWFzLmFuZHJvaWQuY29tL2Fway9yZXMvYW5kcm9pZCI+PHNvbGlkIGFuZHJvaWQ6Y29sb3I9IiMwMDNCMDAiLz48c3Ryb2tlIGFuZHJvaWQ6d2lkdGg9IjRkcCIgYW5kcm9pZDpjb2xvcj0iIzAwRkY0MSIvPjwvc2hhcGU+" | base64 -d > app/src/main/res/drawable/wallpaper_thumbnail.xml
          printf 'package com.example.matrix3d\nimport android.app.*;import android.content.*;import android.graphics.*;import android.os.Bundle;import android.widget.*\nclass MainActivity:Activity(){\n override fun onCreate(b:Bundle?){\n  super.onCreate(b);val p=getSharedPreferences("m",0)\n  val r=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;setBackgroundColor(Color.BLACK);setPadding(64,120,64,64)}\n  fun lbl(s:String)=TextView(this).apply{text=s;setTextColor(Color.GREEN);textSize=18f;typeface=Typeface.MONOSPACE;setPadding(0,32,0,12)}\n  val t1=lbl("3D SPEED: ${p.getInt("sp",10)}")\n  val s1=SeekBar(this).apply{max=28;progress=p.getInt("sp",10)-2;setOnSeekBarChangeListener(object:SeekBar.OnSeekBarChangeListener{override fun onProgressChanged(s:SeekBar?,v:Int,f:Boolean){val x=v+2;t1.text="3D SPEED: $x";p.edit().putInt("sp",x).apply()};override fun onStartTrackingTouch(s:SeekBar?){};override fun onStopTrackingTouch(s:SeekBar?){}})}\n  val t2=lbl("3D SCALE: ${p.getInt("sz",32)}")\n  val s2=SeekBar(this).apply{max=44;progress=p.getInt("sz",32)-16;setOnSeekBarChangeListener(object:SeekBar.OnSeekBarChangeListener{override fun onProgressChanged(s:SeekBar?,v:Int,f:Boolean){val x=v+16;t2.text="3D SCALE: $x";p.edit().putInt("sz",x).apply()};override fun onStartTrackingTouch(s:SeekBar?){};override fun onStopTrackingTouch(s:SeekBar?){}})}\n  val btn=Button(this).apply{text="SET 3D WALLPAPER";setBackgroundColor(Color.GREEN);setTextColor(Color.BLACK);setOnClickListener{try{startActivity(Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER).putExtra(WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT,ComponentName(this@MainActivity,MatrixCityWallpaperService::class.java)))}catch(e:Exception){startActivity(Intent(WallpaperManager.ACTION_LIVE_WALLPAPER_CHOOSER))}}}\n  r.addView(lbl("MATRIX 3D ENGINE v4"));r.addView(t1);r.addView(s1);r.addView(t2);r.addView(s2);r.addView(btn);setContentView(r)\n }\n}\n' > app/src/main/java/com/example/matrix3d/MainActivity.kt
          printf 'package com.example.matrix3d\nimport android.content.Context;import android.graphics.*;import android.hardware.*;import android.os.*;import android.service.wallpaper.WallpaperService;import android.view.*;import kotlin.math.*;import kotlin.random.Random\nclass St3(var x3:Float,var z3:Float,var y:Float,var sp:Float,var ln:Int,val gl:CharArray)\nclass MatrixCityWallpaperService:WallpaperService(){\n override fun onCreateEngine():Engine=E()\n inner class E:Engine(),SensorEventListener{\n  val h=Handler(Looper.getMainLooper());var vis=false;var w=0;var ht=0;var bSz=32f;var mult=1f;var rx=-1f;var ry=-1f;var rr=0f;var yaw=0f;var pitch=0f;var tYaw=0f;var tPitch=0f\n  val sm by lazy{getSystemService(Context.SENSOR_SERVICE) as SensorManager}\n  val ch="ｦｱｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789"\n  var sts=ArrayList<St3>()\n  val p=Paint(Paint.ANTI_ALIAS_FLAG).apply{typeface=Typeface.MONOSPACE;isFakeBoldText=true;textAlign=Paint.Align.CENTER;isSubpixelText=true}\n  val pN=Paint(Paint.ANTI_ALIAS_FLAG).apply{color=Color.parseColor("#00FF66");strokeWidth=3f;style=Paint.Style.STROKE}\n  val rn=object:Runnable{override fun run(){dw();if(vis)h.postDelayed(this,16L)}}\n  fun cfg(){val pr=getSharedPreferences("m",0);bSz=pr.getInt("sz",32).toFloat();mult=pr.getInt("sp",10)/10f}\n  fun init3D(){sts.clear();for(rg in 0..4){val z=0.55f+(rg/5f)*1.45f;for(c in 0..14){sts.add(St3(-1.15f+(c/14f)*2.3f+((rg%%2)*0.07f),z,Random.nextFloat()*-55f,0.22f+Random.nextFloat()*0.25f,Random.nextInt(10,24),CharArray(120){ch.random()}))}};sts.sortByDescending{it.z3}}\n  override fun onSensorChanged(e:SensorEvent){if(e.sensor.type==Sensor.TYPE_ROTATION_VECTOR){val m=FloatArray(9);val o=FloatArray(3);SensorManager.getRotationMatrixFromVector(m,e.values);SensorManager.getOrientation(m,o);tYaw=(o.getOrElse(2){0f}*0.85f).coerceIn(-0.75f,0.75f);tPitch=((o.getOrElse(1){-0.7f}+0.7f)*0.6f).coerceIn(-0.55f,0.55f)}else if(e.sensor.type==Sensor.TYPE_ACCELEROMETER){tYaw=(-e.values.getOrElse(0){0f}/11f).coerceIn(-0.7f,0.7f);tPitch=((e.values.getOrElse(1){5f}-5f)/11f).coerceIn(-0.5f,0.5f)}}\n  override fun onAccuracyChanged(s:Sensor?,a:Int){}\n  override fun onTouchEvent(e:MotionEvent){if(e.action==MotionEvent.ACTION_DOWN){rx=e.x;ry=e.y;rr=10f};super.onTouchEvent(e)}\n  override fun onSurfaceChanged(hl:SurfaceHolder,f:Int,w:Int,ht:Int){super.onSurfaceChanged(hl,f,w,ht);this.w=w;this.ht=ht;cfg();if(sts.isEmpty())init3D()}\n  override fun onVisibilityChanged(v:Boolean){super.onVisibilityChanged(v);vis=v;if(v){cfg();val rv=sm.getDefaultSensor(Sensor.TYPE_ROTATION_VECTOR);if(rv!=null)sm.registerListener(this,rv,SensorManager.SENSOR_DELAY_GAME)else sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)?.let{sm.registerListener(this,it,SensorManager.SENSOR_DELAY_GAME)};h.post(rn)}else{sm.unregisterListener(this);h.removeCallbacks(rn)}}\n  override fun onSurfaceDestroyed(hl:SurfaceHolder){super.onSurfaceDestroyed(hl);vis=false;sm.unregisterListener(this);h.removeCallbacks(rn)}\n  fun dw(){val c=surfaceHolder.lockCanvas()?:return;try{c.drawColor(Color.BLACK);yaw+=(tYaw-yaw)*0.1f;pitch+=(tPitch-pitch)*0.1f;val cy=cos(yaw);val sy=sin(yaw);val hw=w*0.5f;val hh=ht*0.5f;for(s in sts){val prev=s.y.toInt();s.y+=s.sp*mult*(1.15f/(0.45f+s.z3*0.65f));val cur=s.y.toInt();if(cur!=prev&&cur in s.gl.indices)s.gl[cur]=ch.random();if(Random.nextFloat()<0.05f)s.gl[Random.nextInt(s.gl.size)]=ch.random();val cz=s.z3-1.15f;val rx3=s.x3*cy-cz*sy;val rz3=(s.x3*sy+cz*cy)+1.15f;if(rz3>0.28f){val sc=1.25f/rz3;val sz=(bSz*sc).coerceIn(8f,96f);val sx2=hw+rx3*hw*sc;val br=(1.25f/(0.4f+rz3)).coerceIn(0.18f,1f);p.textSize=sz;p.textScaleX=(1f-abs(yaw)*0.22f).coerceIn(0.75f,1f);for(k in 0..s.ln){val r=cur-k;if(r in s.gl.indices){val sy2=hh+(((r*bSz)-hh)*sc)+(pitch*hh*sc*0.85f);if(sy2>-sz&&sy2<ht+sz){p.color=if(k==0)Color.argb((255*br).toInt(),230,255,230)else Color.argb((255*br*(1f-k.toFloat()/s.ln)).toInt().coerceIn(6,245),0,(255*br).toInt(),(70*br).toInt());c.drawText(s.gl[r].toString(),sx2,sy2,p)}}};if(((cur-s.ln)*bSz)>ht*1.5f){s.y=Random.nextFloat()*-18f;s.ln=Random.nextInt(10,24)}}};if(rr>0f){pN.alpha=(255*(1f-rr/550f)).toInt().coerceIn(0,255);c.drawCircle(rx,ry,rr,pN);rr+=22f;if(rr>550f)rr=0f}}finally{surfaceHolder.unlockCanvasAndPost(c)}}\n }\n}\n' > app/src/main/java/com/example/matrix3d/MatrixCityWallpaperService.kt
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.4' }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: MatrixCityLiveWallpaper-APK, path: app/build/outputs/apk/debug/app-debug.apk }
