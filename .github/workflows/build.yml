name: Build Matrix Wallpaper APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Files
        run: |
          mkdir -p app/src/main/java/com/example/matrixcity app/src/main/res/xml app/src/main/res/values app/src/main/res/drawable
          echo 'pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}};dependencyResolutionManagement{repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS);repositories{google();mavenCentral()}};include ":app"' > settings.gradle
          echo 'plugins{id "com.android.application" version "8.2.2" apply false;id "org.jetbrains.kotlin.android" version "1.9.22" apply false}' > build.gradle
          echo 'android.useAndroidX=true' > gradle.properties
          echo 'plugins{id "com.android.application";id "org.jetbrains.kotlin.android"};android{namespace "com.example.matrixcity";compileSdk 34;defaultConfig{applicationId "com.example.matrixcity";minSdk 26;targetSdk 34;versionCode 9;versionName "3.0"};compileOptions{sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17};kotlinOptions{jvmTarget="17"}}' > app/build.gradle
          echo "" | base64 -d > app/src/main/AndroidManifest.xml
          echo "PHdhbGxwYXBlciB4bWxuczphbmRyb2lkPSJodHRwOi8vc2NoZW1hcy5hbmRyb2lkLmNvbS9hcGsvcmVzL2FuZHJvaWQiIGFuZHJvaWQ6c2V0dGluZ3NBY3Rpdml0eT0iY29tLmV4YW1wbGUubWF0cml4Y2l0eS5NYWluQWN0aXZpdHkiIGFuZHJvaWQ6dGh1bWJuYWlsPSJAZHJhd2FibGUvd2FsbHBhcGVyX3RodW1ibmFpbCIgLz4=" | base64 -d > app/src/main/res/xml/wallpaper.xml
          echo "PHJlc291cmNlcz48c3RyaW5nIG5hbWU9ImFwcF9uYW1lIj5NYXRyaXggQ2l0eTwvc3RyaW5nPjwvcmVzb3VyY2VzPg==" | base64 -d > app/src/main/res/values/strings.xml
          echo "PHNoYXBlIHhtbG5zOmFuZHJvaWQ9Imh0dHA6Ly9zY2hlbWFzLmFuZHJvaWQuY29tL2Fway9yZXMvYW5kcm9pZCI+PHNvbGlkIGFuZHJvaWQ6Y29sb3I9IiMwMDNCMDAiLz48c3Ryb2tlIGFuZHJvaWQ6d2lkdGg9IjRkcCIgYW5kcm9pZDpjb2xvcj0iIzAwRkY0MSIvPjwvc2hhcGU+" | base64 -d > app/src/main/res/drawable/wallpaper_thumbnail.xml
          printf 'package com.example.matrixcity\nimport android.app.*;import android.content.*;import android.graphics.*;import android.os.Bundle;import android.view.*;import android.widget.*\nclass MainActivity:Activity(){\n override fun onCreate(b:Bundle?){\n  super.onCreate(b)\n  val p=getSharedPreferences("m",0)\n  val r=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;setBackgroundColor(Color.BLACK);setPadding(64,120,64,64)}\n  fun lbl(s:String)=TextView(this).apply{text=s;setTextColor(Color.parseColor("#00FF41"));textSize=18f;typeface=Typeface.MONOSPACE;setPadding(0,32,0,12)}\n  val t1=lbl("3D FALL SPEED: ${p.getInt("sp",10)}")\n  val s1=SeekBar(this).apply{max=28;progress=p.getInt("sp",10)-2;setOnSeekBarChangeListener(object:SeekBar.OnSeekBarChangeListener{override fun onProgressChanged(s:SeekBar?,v:Int,f:Boolean){val x=v+2;t1.text="3D FALL SPEED: $x";p.edit().putInt("sp",x).apply()};override fun onStartTrackingTouch(s:SeekBar?){};override fun onStopTrackingTouch(s:SeekBar?){}})}\n  val t2=lbl("3D TEXT SCALE: ${p.getInt("sz",34)}")\n  val s2=SeekBar(this).apply{max=46;progress=p.getInt("sz",34)-16;setOnSeekBarChangeListener(object:SeekBar.OnSeekBarChangeListener{override fun onProgressChanged(s:SeekBar?,v:Int,f:Boolean){val x=v+16;t2.text="3D TEXT SCALE: $x";p.edit().putInt("sz",x).apply()};override fun onStartTrackingTouch(s:SeekBar?){};override fun onStopTrackingTouch(s:SeekBar?){}})}\n  val btn=Button(this).apply{text="SET 3D WALLPAPER";setBackgroundColor(Color.parseColor("#00FF41"));setTextColor(Color.BLACK);typeface=Typeface.MONOSPACE;setOnClickListener{try{startActivity(Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER).putExtra(WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT,ComponentName(this@MainActivity,MatrixCityWallpaperService::class.java)))}catch(e:Exception){startActivity(Intent(WallpaperManager.ACTION_LIVE_WALLPAPER_CHOOSER))}}}\n  r.addView(lbl("MATRIX 3D PARALLAX"));r.addView(t1);r.addView(s1);r.addView(t2);r.addView(s2);r.addView(View(this),LinearLayout.LayoutParams(1,60));r.addView(btn)\n  setContentView(r)\n }\n}\n' > app/src/main/java/com/example/matrixcity/MainActivity.kt
          printf 'package com.example.matrixcity\nimport android.content.Context;import android.graphics.*;import android.hardware.*;import android.os.*;import android.service.wallpaper.WallpaperService;import android.view.*;import kotlin.random.Random\nclass MatrixCityWallpaperService:WallpaperService(){\n override fun onCreateEngine():Engine=E()\n inner class E:Engine(),SensorEventListener{\n  val h=Handler(Looper.getMainLooper());var vis=false;var w=0;var ht=0;var bSz=34f;var mult=1f;var rx=-1f;var ry=-1f;var rr=0f\n  var tx=0f;var ty=0f;var sx=0f;var sy=0f\n  val sm by lazy{getSystemService(Context.SENSOR_SERVICE) as SensorManager}\n  val ch="ｦｱｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789"\n  class St(var nx:Float,var z:Float,var y:Float,var sp:Float,var ln:Int,val gl:CharArray)\n  var sts=ArrayList<St>()\n  val pH=Paint(Paint.ANTI_ALIAS_FLAG).apply{typeface=Typeface.MONOSPACE;isFakeBoldText=true;textAlign=Paint.Align.CENTER}\n  val pB=Paint(Paint.ANTI_ALIAS_FLAG).apply{typeface=Typeface.MONOSPACE;isFakeBoldText=true;textAlign=Paint.Align.CENTER}\n  val pN=Paint(Paint.ANTI_ALIAS_FLAG).apply{color=Color.parseColor("#00FF66");strokeWidth=3f;style=Paint.Style.STROKE}\n  val rn=object:Runnable{override fun run(){dw();if(vis)h.postDelayed(this,25L)}}\n  fun cfg(){val p=getSharedPreferences("m",0);bSz=p.getInt("sz",34).toFloat();mult=p.getInt("sp",10)/10f}\n  fun init3D(){sts.clear();for(i in 0..84){val z=0.22f+(i/84f)*0.78f;sts.add(St(Random.nextFloat()*1.2f-0.1f,z,Random.nextFloat()*-40f,0.22f+Random.nextFloat()*0.32f,Random.nextInt(9,24),CharArray(26){ch.random()}))}}\n  override fun onSensorChanged(e:SensorEvent){if(e.sensor.type==Sensor.TYPE_ACCELEROMETER){tx=(-e.values[0]/9.8f).coerceIn(-1f,1f);ty=((e.values[1]-5f)/9.8f).coerceIn(-1f,1f)}}\n  override fun onAccuracyChanged(s:Sensor?,a:Int){}\n  override fun onTouchEvent(e:MotionEvent){if(e.action==MotionEvent.ACTION_DOWN){rx=e.x;ry=e.y;rr=10f};super.onTouchEvent(e)}\n  override fun onSurfaceChanged(hl:SurfaceHolder,f:Int,w:Int,ht:Int){super.onSurfaceChanged(hl,f,w,ht);this.w=w;this.ht=ht;cfg();if(sts.isEmpty())init3D()}\n  override fun onVisibilityChanged(v:Boolean){super.onVisibilityChanged(v);vis=v;if(v){cfg();sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)?.let{sm.registerListener(this,it,SensorManager.SENSOR_DELAY_GAME)};h.post(rn)}else{sm.unregisterListener(this);h.removeCallbacks(rn)}}\n  override fun onSurfaceDestroyed(hl:SurfaceHolder){super.onSurfaceDestroyed(hl);vis=false;sm.unregisterListener(this);h.removeCallbacks(rn)}\n  fun dw(){val c=surfaceHolder.lockCanvas()?:return;try{c.drawColor(Color.BLACK);sx+=(tx-sx)*0.12f;sy+=(ty-sy)*0.12f;for(s in sts){val sz=bSz*s.z;val prev=s.y.toInt();s.y+=s.sp*mult*(0.4f+s.z*0.9f);val cur=s.y.toInt();if(cur!=prev&&cur in s.gl.indices)s.gl[cur]=ch.random();if(Random.nextFloat()<0.08f)s.gl[Random.nextInt(s.gl.size)]=ch.random();val px=s.nx*w+sx*w*0.24f*(s.z*s.z);val pyOff=sy*ht*0.14f*(s.z*s.z);val br=(0.28f+s.z*0.72f);pH.textSize=sz;pB.textSize=sz;if(s.z>0.75f)pH.setShadowLayer(12f*s.z,0f,0f,Color.parseColor("#00FF41"))else pH.clearShadowLayer();for(k in 0..s.ln){val r=cur-k;if(r in s.gl.indices){val y=(r+1)*sz+pyOff;if(y>-sz&&y<ht+sz){if(k==0){pH.color=Color.argb((255*br).toInt(),(215*br).toInt(),255,(215*br).toInt());c.drawText(s.gl[r].toString(),px,y,pH)}else{val al=(255*br*(1f-k.toFloat()/s.ln)).toInt().coerceIn(8,245);pB.color=Color.argb(al,0,(255*br).toInt(),(65*br).toInt());c.drawText(s.gl[r].toString(),px,y,pB)}}}};if((cur-s.ln)*sz>ht+40f){s.y=Random.nextFloat()*-12f;s.nx=Random.nextFloat()*1.2f-0.1f;s.ln=Random.nextInt(9,24)}};if(rr>0f){pN.alpha=(255*(1f-rr/550f)).toInt().coerceIn(0,255);c.drawCircle(rx,ry,rr,pN);rr+=20f;if(rr>550f)rr=0f}}finally{surfaceHolder.unlockCanvasAndPost(c)}}\n }\n}\n' > app/src/main/java/com/example/matrixcity/MatrixCityWallpaperService.kt
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.4' }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: MatrixCityLiveWallpaper-APK, path: app/build/outputs/apk/debug/app-debug.apk }
