name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p app/src/main/java/c/m app/src/main/res/xml app/src/main/res/values app/src/main/res/drawable
          echo 'pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}};dependencyResolutionManagement{repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS);repositories{google();mavenCentral()}};include ":app"' > settings.gradle
          echo 'plugins{id "com.android.application" version "8.2.2" apply false;id "org.jetbrains.kotlin.android" version "1.9.22" apply false}' > build.gradle
          echo 'android.useAndroidX=true' > gradle.properties
          echo 'plugins{id "com.android.application";id "org.jetbrains.kotlin.android"};android{namespace "c.m";compileSdk 34;defaultConfig{applicationId "com.example.matrix3d";minSdk 26;targetSdk 34;versionCode 5;versionName "7.0"};compileOptions{sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17};kotlinOptions{jvmTarget="17"}};dependencies{implementation "androidx.core:core-ktx:1.12.0"}' > app/build.gradle
          python3 -c 'q=chr(34);e=chr(61);u="ht"+"tp://"+"schemas."+"android."+"com/apk/res/android";x=f"<manifest xmlns:android{e}{q}{u}{q}><uses-feature android:name{e}{q}android.software.live_wallpaper{q} android:required{e}{q}true{q}/><application android:hardwareAccelerated{e}{q}true{q} android:icon{e}{q}@drawable/ic{q} android:label{e}{q}@string/n{q}><activity android:name{e}{q}.MainActivity{q} android:exported{e}{q}true{q}><intent-filter><action android:name{e}{q}android.intent.action.MAIN{q}/><category android:name{e}{q}android.intent.category.LAUNCHER{q}/></intent-filter></activity><service android:name{e}{q}.W{q} android:enabled{e}{q}true{q} android:exported{e}{q}true{q} android:label{e}{q}@string/n{q} android:permission{e}{q}android.permission.BIND_WALLPAPER{q}><intent-filter><action android:name{e}{q}android.service.wallpaper.WallpaperService{q}/></intent-filter><meta-data android:name{e}{q}android.service.wallpaper{q} android:resource{e}{q}@xml/w{q}/></service></application></manifest>";open("app/src/main/AndroidManifest.xml","w").write(x);open("app/src/main/res/xml/w.xml","w").write(f"<wallpaper xmlns:android{e}{q}{u}{q} android:settingsActivity{e}{q}c.m.MainActivity{q} android:thumbnail{e}{q}@drawable/ic{q}/>");open("app/src/main/res/values/strings.xml","w").write(f"<resources><string name{e}{q}n{q}>Matrix 3D</string></resources>");open("app/src/main/res/drawable/ic.xml","w").write(f"<shape xmlns:android{e}{q}{u}{q}><solid android:color{e}{q}#003B00{q}/></shape>")'
          printf 'package c.m\nimport android.app.*;import android.content.*;import android.graphics.*;import android.os.Bundle;import android.widget.*\nclass MainActivity:Activity(){\noverride fun onCreate(b:Bundle?){\nsuper.onCreate(b)\nval p=getSharedPreferences("m",0)\nval sv=ScrollView(this).apply{setBackgroundColor(Color.BLACK)}\nval r=LinearLayout(this).apply{orientation=1;setPadding(56,90,56,64)}\nfun l(s:String)=TextView(this).apply{text=s;setTextColor(Color.GREEN);textSize=16f;typeface=Typeface.MONOSPACE;setPadding(0,22,0,8)}\nval ths=arrayOf("MATRIX GREEN","CYBER CYAN","CRIMSON RED","SOLAR GOLD","RAINBOW PRISM")\nval bTh=Button(this).apply{text="THEME: ${ths[p.getInt("th",0)%%5]}";setBackgroundColor(Color.DKGRAY);setTextColor(Color.GREEN);setOnClickListener{val n=(p.getInt("th",0)+1)%%5;p.edit().putInt("th",n).apply();text="THEME: ${ths[n]}"}}\nval t1=l("SPEED: ${p.getInt("sp",12)}")\nval s1=SeekBar(this).apply{max=28;progress=p.getInt("sp",12)-2;setOnSeekBarChangeListener(object:SeekBar.OnSeekBarChangeListener{override fun onProgressChanged(s:SeekBar?,v:Int,f:Boolean){t1.text="SPEED: ${v+2}";p.edit().putInt("sp",v+2).apply()};override fun onStartTrackingTouch(s:SeekBar?){};override fun onStopTrackingTouch(s:SeekBar?){}})}\nval t2=l("SCALE: ${p.getInt("sz",42)}")\nval s2=SeekBar(this).apply{max=48;progress=p.getInt("sz",42)-20;setOnSeekBarChangeListener(object:SeekBar.OnSeekBarChangeListener{override fun onProgressChanged(s:SeekBar?,v:Int,f:Boolean){t2.text="SCALE: ${v+20}";p.edit().putInt("sz",v+20).apply()};override fun onStartTrackingTouch(s:SeekBar?){};override fun onStopTrackingTouch(s:SeekBar?){}})}\nfun sw(lb:String,k:String)=Switch(this).apply{text=lb;isChecked=p.getBoolean(k,true);setTextColor(Color.WHITE);typeface=Typeface.MONOSPACE;setPadding(0,18,0,18);setOnCheckedChangeListener{_,v->p.edit().putBoolean(k,v).apply()}}\nval btn=Button(this).apply{text="SET 3D WALLPAPER";setBackgroundColor(Color.GREEN);setTextColor(Color.BLACK);setOnClickListener{try{startActivity(Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER).putExtra(WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT,ComponentName(this@MainActivity,W::class.java)))}catch(e:Exception){startActivity(Intent(WallpaperManager.ACTION_LIVE_WALLPAPER_CHOOSER))}}}\nr.addView(l("MATRIX 3D v7 SUITE"));r.addView(bTh);r.addView(t1);r.addView(s1);r.addView(t2);r.addView(s2);r.addView(sw("LENS BLOOM & BOKEH","f1"));r.addView(sw("TOUCH 3D REPEL & SURGE","f2"));r.addView(sw("FOLD-ADAPTIVE FOV","f3"));r.addView(sw("3D HORIZON GRID","f4"));r.addView(btn);sv.addView(r);setContentView(sv)\n}}\n' > app/src/main/java/c/m/MainActivity.kt
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.4' }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: MatrixCityLiveWallpaper-APK, path: app/build/outputs/apk/debug/app-debug.apk }
