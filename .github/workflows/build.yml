name: Build Matrix Wallpaper APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Files
        run: |
          mkdir -p app/src/main/java/com/example/matrixcity app/src/main/res/xml app/src/main/res/values app/src/main/res/drawable
          echo 'pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}};dependencyResolutionManagement{repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS);repositories{google();mavenCentral()}};include ":app"' > settings.gradle
          echo 'plugins{id "com.android.application" version "8.2.2" apply false;id "org.jetbrains.kotlin.android" version "1.9.22" apply false}' > build.gradle
          echo 'android.useAndroidX=true' > gradle.properties
          echo 'plugins{id "com.android.application";id "org.jetbrains.kotlin.android"};android{namespace "com.example.matrixcity";compileSdk 34;defaultConfig{applicationId "com.example.matrixcity";minSdk 26;targetSdk 34;versionCode 7;versionName "2.1"};compileOptions{sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17};kotlinOptions{jvmTarget="17"}}' > app/build.gradle
          echo "" | base64 -d > app/src/main/AndroidManifest.xml
          echo "PHdhbGxwYXBlciB4bWxuczphbmRyb2lkPSJodHRwOi8vc2NoZW1hcy5hbmRyb2lkLmNvbS9hcGsvcmVzL2FuZHJvaWQiIGFuZHJvaWQ6c2V0dGluZ3NBY3Rpdml0eT0iY29tLmV4YW1wbGUubWF0cml4Y2l0eS5NYWluQWN0aXZpdHkiIGFuZHJvaWQ6dGh1bWJuYWlsPSJAZHJhd2FibGUvd2FsbHBhcGVyX3RodW1ibmFpbCIgLz4=" | base64 -d > app/src/main/res/xml/wallpaper.xml
          echo "PHJlc291cmNlcz48c3RyaW5nIG5hbWU9ImFwcF9uYW1lIj5NYXRyaXggQ2l0eTwvc3RyaW5nPjwvcmVzb3VyY2VzPg==" | base64 -d > app/src/main/res/values/strings.xml
          echo "PHNoYXBlIHhtbG5zOmFuZHJvaWQ9Imh0dHA6Ly9zY2hlbWFzLmFuZHJvaWQuY29tL2Fway9yZXMvYW5kcm9pZCI+PHNvbGlkIGFuZHJvaWQ6Y29sb3I9IiMwMDNCMDAiLz48c3Ryb2tlIGFuZHJvaWQ6d2lkdGg9IjRkcCIgYW5kcm9pZDpjb2xvcj0iIzAwRkY0MSIvPjwvc2hhcGU+" | base64 -d > app/src/main/res/drawable/wallpaper_thumbnail.xml
          printf 'package com.example.matrixcity\nimport android.app.*;import android.content.*;import android.graphics.*;import android.os.Bundle;import android.view.*;import android.widget.*\nclass MainActivity:Activity(){\n override fun onCreate(b:Bundle?){\n  super.onCreate(b)\n  val p=getSharedPreferences("m",0)\n  val r=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;setBackgroundColor(Color.BLACK);setPadding(64,120,64,64)}\n  fun lbl(s:String)=TextView(this).apply{text=s;setTextColor(Color.parseColor("#00FF41"));textSize=18f;typeface=Typeface.MONOSPACE;setPadding(0,32,0,12)}\n  val t1=lbl("FALL SPEED: ${p.getInt("sp",10)}")\n  val s1=SeekBar(this).apply{max=28;progress=p.getInt("sp",10)-2;setOnSeekBarChangeListener(object:SeekBar.OnSeekBarChangeListener{override fun onProgressChanged(s:SeekBar?,v:Int,f:Boolean){val x=v+2;t1.text="FALL SPEED: $x";p.edit().putInt("sp",x).apply()};override fun onStartTrackingTouch(s:SeekBar?){};override fun onStopTrackingTouch(s:SeekBar?){}})}\n  val t2=lbl("TEXT SIZE: ${p.getInt("sz",28)}")\n  val s2=SeekBar(this).apply{max=46;progress=p.getInt("sz",28)-14;setOnSeekBarChangeListener(object:SeekBar.OnSeekBarChangeListener{override fun onProgressChanged(s:SeekBar?,v:Int,f:Boolean){val x=v+14;t2.text="TEXT SIZE: $x";p.edit().putInt("sz",x).apply()};override fun onStartTrackingTouch(s:SeekBar?){};override fun onStopTrackingTouch(s:SeekBar?){}})}\n  val btn=Button(this).apply{text="SET LIVE WALLPAPER";setBackgroundColor(Color.parseColor("#00FF41"));setTextColor(Color.BLACK);typeface=Typeface.MONOSPACE;setOnClickListener{try{startActivity(Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER).putExtra(WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT,ComponentName(this@MainActivity,MatrixCityWallpaperService::class.java)))}catch(e:Exception){startActivity(Intent(WallpaperManager.ACTION_LIVE_WALLPAPER_CHOOSER))}}}\n  r.addView(lbl("MATRIX DIGITAL RAIN"));r.addView(t1);r.addView(s1);r.addView(t2);r.addView(s2);r.addView(View(this),LinearLayout.LayoutParams(1,60));r.addView(btn)\n  setContentView(r)\n }\n}\n' > app/src/main/java/com/example/matrixcity/MainActivity.kt
          printf 'package com.example.matrixcity\nimport android.graphics.*;import android.os.*;import android.service.wallpaper.WallpaperService;import android.view.*;import kotlin.random.Random\nclass MatrixCityWallpaperService:WallpaperService(){\n override fun onCreateEngine():Engine=E()\n inner class E:Engine(){\n  val h=Handler(Looper.getMainLooper());var vis=false;var w=0;var ht=0;var sz=28f;var mult=1f;var rx=-1f;var ry=-1f;var rr=0f\n  var dr=FloatArray(0);var sp=FloatArray(0)\n  val ch="ｦｱｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789"\n  val pH=Paint().apply{color=Color.parseColor("#E8FFE8");typeface=Typeface.MONOSPACE;isFakeBoldText=true;setShadowLayer(10f,0f,0f,Color.parseColor("#00FF41"))}\n  val pB=Paint().apply{color=Color.parseColor("#00FF41");typeface=Typeface.MONOSPACE}\n  val pD=Paint().apply{color=Color.parseColor("#00661A");typeface=Typeface.MONOSPACE}\n  val pF=Paint().apply{color=Color.argb(26,0,4,0)}\n  val pN=Paint().apply{color=Color.parseColor("#00FF66");strokeWidth=3f;style=Paint.Style.STROKE}\n  val rn=object:Runnable{override fun run(){dw();if(vis)h.postDelayed(this,33L)}}\n  fun cfg(){val p=getSharedPreferences("m",0);val nSz=p.getInt("sz",28).toFloat();mult=p.getInt("sp",10)/10f;if(nSz!=sz&&w>0){sz=nSz;initCols()}else{sz=nSz};pH.textSize=sz;pB.textSize=sz;pD.textSize=sz}\n  fun initCols(){val c=(w/sz).toInt().coerceAtLeast(1);dr=FloatArray(c){Random.nextFloat()*-40f};sp=FloatArray(c){0.45f+Random.nextFloat()*0.75f}}\n  override fun onTouchEvent(e:MotionEvent){if(e.action==MotionEvent.ACTION_DOWN){rx=e.x;ry=e.y;rr=10f};super.onTouchEvent(e)}\n  override fun onSurfaceChanged(hl:SurfaceHolder,f:Int,w:Int,ht:Int){super.onSurfaceChanged(hl,f,w,ht);this.w=w;this.ht=ht;cfg();initCols()}\n  override fun onVisibilityChanged(v:Boolean){super.onVisibilityChanged(v);vis=v;if(v){cfg();h.post(rn)}else h.removeCallbacks(rn)}\n  override fun onSurfaceDestroyed(hl:SurfaceHolder){super.onSurfaceDestroyed(hl);vis=false;h.removeCallbacks(rn)}\n  fun dw(){val c=surfaceHolder.lockCanvas()?:return;try{c.drawRect(0f,0f,w.toFloat(),ht.toFloat(),pF);for(i in dr.indices){val x=i*sz;val y=dr[i]*sz;if(y>0&&y<ht){c.drawText(ch.random().toString(),x,y,pH);if(dr[i]>1f)c.drawText(ch.random().toString(),x,(dr[i]-1f)*sz,pB);if(dr[i]>4f&&Random.nextFloat()>0.5f)c.drawText(ch.random().toString(),x,(dr[i]-4f)*sz,pD)};if(y>ht&&Random.nextFloat()>0.97f){dr[i]=0f;sp[i]=0.45f+Random.nextFloat()*0.75f};dr[i]+=sp[i]*mult};if(rr>0f){pN.alpha=(255*(1f-rr/500f)).toInt().coerceIn(0,255);c.drawCircle(rx,ry,rr,pN);pN.alpha=255;rr+=18f;if(rr>500f)rr=0f}}finally{surfaceHolder.unlockCanvasAndPost(c)}}\n }\n}\n' > app/src/main/java/com/example/matrixcity/MatrixCityWallpaperService.kt
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.4' }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: MatrixCityLiveWallpaper-APK, path: app/build/outputs/apk/debug/app-debug.apk }
