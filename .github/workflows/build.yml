name: Build Matrix Wallpaper APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Files
        run: |
          mkdir -p app/src/main/java/com/example/matrixcity app/src/main/res/xml app/src/main/res/values app/src/main/res/drawable
          echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }; dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }; include ":app"' > settings.gradle
          echo 'plugins { id "com.android.application" version "8.2.2" apply false; id "org.jetbrains.kotlin.android" version "1.9.22" apply false }' > build.gradle
          echo 'android.useAndroidX=true' > gradle.properties
          echo 'plugins { id "com.android.application"; id "org.jetbrains.kotlin.android" }; android { namespace "com.example.matrixcity"; compileSdk 34; defaultConfig { applicationId "com.example.matrixcity"; minSdk 26; targetSdk 34; versionCode 4; versionName "1.3" }; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = "17" } }' > app/build.gradle
          echo "" | base64 -d > app/src/main/AndroidManifest.xml
          echo "PHdhbGxwYXBlciB4bWxuczphbmRyb2lkPSJodHRwOi8vc2NoZW1hcy5hbmRyb2lkLmNvbS9hcGsvcmVzL2FuZHJvaWQiIGFuZHJvaWQ6dGh1bWJuYWlsPSJAZHJhd2FibGUvd2FsbHBhcGVyX3RodW1ibmFpbCIgLz4=" | base64 -d > app/src/main/res/xml/wallpaper.xml
          echo "PHJlc291cmNlcz48c3RyaW5nIG5hbWU9ImFwcF9uYW1lIj5NYXRyaXggQ2l0eTwvc3RyaW5nPjwvcmVzb3VyY2VzPg==" | base64 -d > app/src/main/res/values/strings.xml
          echo "PHNoYXBlIHhtbG5zOmFuZHJvaWQ9Imh0dHA6Ly9zY2hlbWFzLmFuZHJvaWQuY29tL2Fway9yZXMvYW5kcm9pZCI+PHNvbGlkIGFuZHJvaWQ6Y29sb3I9IiMwMDNCMDAiLz48c3Ryb2tlIGFuZHJvaWQ6d2lkdGg9IjRkcCIgYW5kcm9pZDpjb2xvcj0iIzAwRkY0MSIvPjwvc2hhcGU+" | base64 -d > app/src/main/res/drawable/wallpaper_thumbnail.xml
          printf 'package com.example.matrixcity\nimport android.app.*;import android.content.*;import android.os.Bundle\nclass MainActivity : Activity(){override fun onCreate(b:Bundle?){super.onCreate(b);try{startActivity(Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER).putExtra(WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT,ComponentName(this,MatrixCityWallpaperService::class.java)))}catch(e:Exception){startActivity(Intent(WallpaperManager.ACTION_LIVE_WALLPAPER_CHOOSER))};finish()}}\n' > app/src/main/java/com/example/matrixcity/MainActivity.kt
          printf 'package com.example.matrixcity\nimport android.graphics.*;import android.os.*;import android.service.wallpaper.WallpaperService;import android.view.SurfaceHolder;import kotlin.math.*;import kotlin.random.Random\nclass MatrixCityWallpaperService:WallpaperService(){\n override fun onCreateEngine():Engine=E()\n inner class E:Engine(){\n  val h=Handler(Looper.getMainLooper());var vis=false;var w=0;var ht=0;val sz=26f;var tk=0f\n  var dr=FloatArray(0);var sp=FloatArray(0);var bH=FloatArray(0);var bW=FloatArray(0);var bX=FloatArray(0);var bT=IntArray(0)\n  val cX=FloatArray(18);val cY=FloatArray(18);val cV=FloatArray(18)\n  val ch="ｦｱｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789"\n  val pH=Paint().apply{color=Color.parseColor("#E8FFE8");textSize=26f;typeface=Typeface.MONOSPACE;isFakeBoldText=true;setShadowLayer(10f,0f,0f,Color.parseColor("#00FF41"))}\n  val pB=Paint().apply{color=Color.parseColor("#00FF41");textSize=26f;typeface=Typeface.MONOSPACE}\n  val pF=Paint().apply{color=Color.argb(28,0,5,2)}\n  val pFr=Paint().apply{color=Color.parseColor("#030B06")}\n  val pSd=Paint().apply{color=Color.parseColor("#081F11")}\n  val pN=Paint().apply{color=Color.parseColor("#00FF66");strokeWidth=2f;style=Paint.Style.STROKE}\n  val pW=Paint().apply{color=Color.parseColor("#00E65C")}\n  val pBm=Paint().apply{color=Color.argb(24,0,255,110)}\n  val pCC=Paint().apply{color=Color.parseColor("#00F0FF");strokeWidth=4f;strokeCap=Paint.Cap.ROUND}\n  val pCR=Paint().apply{color=Color.parseColor("#FF2A6D");strokeWidth=4f;strokeCap=Paint.Cap.ROUND}\n  val pG=Paint().apply{color=Color.argb(70,0,255,90);strokeWidth=1.5f}\n  val rn=object:Runnable{override fun run(){dw();if(vis)h.postDelayed(this,33L)}}\n  override fun onSurfaceChanged(hl:SurfaceHolder,f:Int,w:Int,ht:Int){super.onSurfaceChanged(hl,f,w,ht);this.w=w;this.ht=ht;val c=(w/sz).toInt().coerceAtLeast(1);dr=FloatArray(c){Random.nextFloat()*-40f};sp=FloatArray(c){0.45f+Random.nextFloat()*0.75f};bH=FloatArray(15);bW=FloatArray(15);bX=FloatArray(15);bT=IntArray(15);for(i in 0..14){bW[i]=w*(0.09f+Random.nextFloat()*0.08f);bX[i]=(w/15f)*i-10f;bH[i]=ht*(0.14f+Random.nextFloat()*0.28f);bT[i]=Random.nextInt(1,4)};for(i in 0..17){cX[i]=Random.nextFloat()*w;cY[i]=ht-(ht*(0.04f+Random.nextFloat()*0.26f));cV[i]=(if(i%%2==0)1f else -1f)*(3.5f+Random.nextFloat()*5.5f)}}\n  override fun onVisibilityChanged(v:Boolean){super.onVisibilityChanged(v);vis=v;if(v)h.post(rn)else h.removeCallbacks(rn)}\n  override fun onSurfaceDestroyed(hl:SurfaceHolder){super.onSurfaceDestroyed(hl);vis=false;h.removeCallbacks(rn)}\n  fun dw(){val c=surfaceHolder.lockCanvas()?:return;try{tk+=0.03f;c.drawRect(0f,0f,w.toFloat(),ht.toFloat(),pF);for(i in dr.indices){val x=i*sz;val y=dr[i]*sz;if(y>0&&y<ht){c.drawText(ch.random().toString(),x,y,pH);if(dr[i]>1f)c.drawText(ch.random().toString(),x,(dr[i]-1f)*sz,pB)};if(y>ht&&Random.nextFloat()>0.97f){dr[i]=0f;sp[i]=0.45f+Random.nextFloat()*0.75f};dr[i]+=sp[i]};if(bH.isNotEmpty()){val pt=Path();for(s in 0..2){val bx=w*(0.2f+s*0.3f);val a=sin(tk+s*2.1f)*0.42f;pt.reset();pt.moveTo(bx,ht*0.85f);pt.lineTo(bx+sin(a)*ht*0.6f-70f,ht*0.25f);pt.lineTo(bx+sin(a)*ht*0.6f+70f,ht*0.25f);pt.close();c.drawPath(pt,pBm)};for(i in bH.indices){val l=bX[i];val bw=bW[i];val t=ht-bH[i];val d=bw*0.28f;c.drawRect(l,t,l+bw,ht.toFloat(),pFr);pt.reset();pt.moveTo(l+bw,t);pt.lineTo(l+bw+d,t+d*0.6f);pt.lineTo(l+bw+d,ht.toFloat());pt.lineTo(l+bw,ht.toFloat());pt.close();c.drawPath(pt,pSd);c.drawLine(l,t,l+bw,t,pN);c.drawLine(l,t,l,ht.toFloat(),pN);c.drawLine(l+bw,t,l+bw,ht.toFloat(),pN);if(bT[i]>=2){val sw=bw*0.6f;val st=t-28f;c.drawRect(l+bw*0.2f,st,l+bw*0.2f+sw,t,pFr);c.drawLine(l+bw*0.2f,st,l+bw*0.2f+sw,st,pN);if(bT[i]==3){val mx=l+bw*0.5f;c.drawLine(mx,st,mx,st-34f,pN);if(sin(tk*5f+i)>0f)c.drawCircle(mx,st-36f,4f,pCR)}};var wy=t+14f;while(wy<ht-38f){if(((i*13+wy.toInt()+(tk*2f).toInt())%%7)!=0)c.drawLine(l+8f,wy,l+bw-8f,wy,pW);wy+=14f}};val gy=ht-34f;c.drawRect(0f,gy,w.toFloat(),ht.toFloat(),pFr);c.drawLine(0f,gy,w.toFloat(),gy,pN);var gx=-40f+((tk*40f)%%40f);while(gx<w+40f){c.drawLine(gx,gy,gx-25f,ht.toFloat(),pG);gx+=40f};for(i in 0..17){cX[i]+=cV[i];if(cX[i]>w+60f)cX[i]=-60f else if(cX[i]<-60f)cX[i]=w+60f;c.drawLine(cX[i],cY[i],cX[i]+(if(cV[i]>0f)-26f else 26f),cY[i],if(cV[i]>0f)pCC else pCR)}}}finally{surfaceHolder.unlockCanvasAndPost(c)}}\n }\n}\n' > app/src/main/java/com/example/matrixcity/MatrixCityWallpaperService.kt
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.4' }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: MatrixCityLiveWallpaper-APK, path: app/build/outputs/apk/debug/app-debug.apk }
