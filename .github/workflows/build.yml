name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p app/src/main/java/c/m app/src/main/res/xml app/src/main/res/values app/src/main/res/drawable
          echo 'pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}};dependencyResolutionManagement{repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS);repositories{google();mavenCentral()}};include ":app"' > settings.gradle
          echo 'plugins{id "com.android.application" version "8.2.2" apply false;id "org.jetbrains.kotlin.android" version "1.9.22" apply false}' > build.gradle
          echo 'android.useAndroidX=true' > gradle.properties
          echo 'plugins{id "com.android.application";id "org.jetbrains.kotlin.android"};android{namespace "c.m";compileSdk 34;defaultConfig{applicationId "com.example.matrix3d";minSdk 26;targetSdk 34;versionCode 3;versionName "5.0"};compileOptions{sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17};kotlinOptions{jvmTarget="17"}};dependencies{implementation "androidx.core:core-ktx:1.12.0"}' > app/build.gradle
          printf '<wallpaper xmlns:android="http://android.com" android:settingsActivity="c.m.MainActivity" android:thumbnail="@drawable/ic"/>\n' > app/src/main/res/xml/w.xml
          printf '<resources><string name="n">Matrix 3D</string></resources>\n' > app/src/main/res/values/strings.xml
          printf '<shape xmlns:android="http://android.com"><solid android:color="#003B00"/></shape>\n' > app/src/main/res/drawable/ic.xml
          printf 'package c.m\nimport android.app.*;import android.content.*;import android.graphics.*;import android.os.Bundle;import android.widget.*\nclass MainActivity:Activity(){override fun onCreate(b:Bundle?){super.onCreate(b);val p=getSharedPreferences("m",0);val r=LinearLayout(this).apply{orientation=1;setBackgroundColor(Color.BLACK);setPadding(64,120,64,64)};fun l(s:String)=TextView(this).apply{text=s;setTextColor(Color.GREEN);textSize=18f;typeface=Typeface.MONOSPACE;setPadding(0,32,0,12)};val t1=l("SPEED: ${p.getInt("sp",10)}");val s1=SeekBar(this).apply{max=28;progress=p.getInt("sp",10)-2;setOnSeekBarChangeListener(object:SeekBar.OnSeekBarChangeListener{override fun onProgressChanged(s:SeekBar?,v:Int,f:Boolean){t1.text="SPEED: ${v+2}";p.edit().putInt("sp",v+2).apply()};override fun onStartTrackingTouch(s:SeekBar?){};override fun onStopTrackingTouch(s:SeekBar?){}})};val t2=l("SCALE: ${p.getInt("sz",36)}");val s2=SeekBar(this).apply{max=44;progress=p.getInt("sz",36)-18;setOnSeekBarChangeListener(object:SeekBar.OnSeekBarChangeListener{override fun onProgressChanged(s:SeekBar?,v:Int,f:Boolean){t2.text="SCALE: ${v+18}";p.edit().putInt("sz",v+18).apply()};override fun onStartTrackingTouch(s:SeekBar?){};override fun onStopTrackingTouch(s:SeekBar?){}})};val btn=Button(this).apply{text="SET 3D WALLPAPER";setBackgroundColor(Color.GREEN);setTextColor(Color.BLACK);setOnClickListener{try{startActivity(Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER).putExtra(WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT,ComponentName(this@MainActivity,W::class.java)))}catch(e:Exception){startActivity(Intent(WallpaperManager.ACTION_LIVE_WALLPAPER_CHOOSER))}}};r.addView(l("MATRIX 3D v5"));r.addView(t1);r.addView(s1);r.addView(t2);r.addView(s2);r.addView(btn);setContentView(r)}}\n' > app/src/main/java/c/m/MainActivity.kt
          printf 'package c.m\nimport android.content.Context;import android.graphics.*;import android.hardware.*;import android.os.*;import android.service.wallpaper.WallpaperService;import android.view.*;import kotlin.math.*;import kotlin.random.Random\nclass St(var x:Float,var z:Float,var y:Float,var sp:Float,var ln:Int,var ph:Float,val gl:CharArray)\nclass W:WallpaperService(){override fun onCreateEngine()=E();inner class E:Engine(),SensorEventListener{val h=Handler(Looper.getMainLooper());var vis=false;var w=0;var ht=0;var bSz=36f;var ml=1f;var rx=-1f;var ry=-1f;var rr=0f;var yw=0f;var pt=0f;var ty=0f;var tp=0f;var tk=0f;val sm by lazy{getSystemService(Context.SENSOR_SERVICE) as SensorManager};val ch="ｦｱｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789";var sts=ArrayList<St>();val p=Paint(1).apply{typeface=Typeface.MONOSPACE;isFakeBoldText=true;textAlign=Paint.Align.CENTER;isSubpixelText=true};val pN=Paint(1).apply{color=Color.GREEN;strokeWidth=3f;style=Paint.Style.STROKE};val rn=object:Runnable{override fun run(){dw();if(vis)h.postDelayed(this,16L)}};fun cfg(){val pr=getSharedPreferences("m",0);bSz=pr.getInt("sz",36).toFloat();ml=pr.getInt("sp",10)/10f};fun init(){sts.clear();for(rg in 0..4){val z=0.55f+(rg/5f)*1.45f;for(c in 0..12)sts.add(St(-1.15f+(c/12f)*2.3f+((rg%%2)*0.08f),z,Random.nextFloat()*-55f,0.22f+Random.nextFloat()*0.24f,Random.nextInt(9,20),Random.nextFloat()*6.28f,CharArray(120){ch.random()}))};sts.sortByDescending{it.z}};override fun onSensorChanged(e:SensorEvent){if(e.sensor.type==Sensor.TYPE_ROTATION_VECTOR){val m=FloatArray(9);val o=FloatArray(3);SensorManager.getRotationMatrixFromVector(m,e.values);SensorManager.getOrientation(m,o);ty=(o.getOrElse(2){0f}*0.95f).coerceIn(-0.85f,0.85f);tp=((o.getOrElse(1){-0.7f}+0.7f)*0.7f).coerceIn(-0.65f,0.65f)}else if(e.sensor.type==Sensor.TYPE_ACCELEROMETER){ty=(-e.values.getOrElse(0){0f}/10f).coerceIn(-0.8f,0.8f);tp=((e.values.getOrElse(1){5f}-5f)/10f).coerceIn(-0.6f,0.6f)}};override fun onAccuracyChanged(s:Sensor?,a:Int){};override fun onTouchEvent(e:MotionEvent){if(e.action==0){rx=e.x;ry=e.y;rr=10f};super.onTouchEvent(e)};override fun onSurfaceChanged(hl:SurfaceHolder,f:Int,w:Int,ht:Int){super.onSurfaceChanged(hl,f,w,ht);this.w=w;this.ht=ht;cfg();if(sts.isEmpty())init()};override fun onVisibilityChanged(v:Boolean){super.onVisibilityChanged(v);vis=v;if(v){cfg();val rv=sm.getDefaultSensor(Sensor.TYPE_ROTATION_VECTOR);if(rv!=null)sm.registerListener(this,rv,1)else sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)?.let{sm.registerListener(this,it,1)};h.post(rn)}else{sm.unregisterListener(this);h.removeCallbacks(rn)}};override fun onSurfaceDestroyed(hl:SurfaceHolder){super.onSurfaceDestroyed(hl);vis=false;sm.unregisterListener(this);h.removeCallbacks(rn)};fun dw(){val c=surfaceHolder.lockCanvas()?:return;try{c.drawColor(Color.BLACK);tk+=0.05f;yw+=(ty-yw)*0.12f;pt+=(tp-pt)*0.12f;val cy=cos(yw);val sy=sin(yw);val hw=w*0.5f;val hh=ht*0.5f;for(s in sts){val pv=s.y.toInt();s.y+=s.sp*ml*(1.15f/(0.45f+s.z*0.65f));val cr=s.y.toInt();if(cr!=pv&&cr in s.gl.indices)s.gl[cr]=ch.random();if(Random.nextFloat()<0.04f)s.gl[Random.nextInt(s.gl.size)]=ch.random();val cz=s.z-1.15f;val rx3=s.x*cy-cz*sy;val rz3=(s.x*sy+cz*cy)+1.15f;if(rz3>0.3f){val sc=1.25f/rz3;val sz=(bSz*sc).coerceIn(10f,96f);val sx=hw+rx3*hw*sc;val br=(1.25f/(0.4f+rz3)).coerceIn(0.2f,1f);val vx=(sx-hw)/hw;p.textSize=sz;val dp=(sz*0.16f).coerceIn(2f,12f);val ly=if(rz3<1.1f)5 else 2;for(k in 0..s.ln){val r=cr-k;if(r in s.gl.indices){val sy2=hh+(((r*bSz)-hh)*sc)+(pt*hh*sc*0.9f);if(sy2>-sz&&sy2<ht+sz){val vy=(sy2-hh)/hh;val al=(255*br*(if(k==0)1f else 1f-k.toFloat()/s.ln)).toInt().coerceIn(8,255);val spn=cos(tk+s.ph+r*0.25f);p.textScaleX=(0.35f+0.65f*abs(spn)).coerceIn(0.35f,1f);val g=s.gl[r].toString();for(d in ly downTo 1){val t=d.toFloat()/ly;val ox=vx*dp*t+(if(spn>=0f)-dp*0.4f*t else dp*0.4f*t);p.color=Color.argb((al*0.65f).toInt(),0,(110*br*(1f-t*0.5f)).toInt(),(35*br).toInt());c.drawText(g,sx+ox,sy2+vy*dp*t,p)};p.color=if(k==0)Color.argb(al,235,255,235)else Color.argb(al,0,(255*br).toInt(),(80*br).toInt());c.drawText(g,sx,sy2,p)}}};if(((cr-s.ln)*bSz)>ht*1.5f){s.y=Random.nextFloat()*-18f;s.ln=Random.nextInt(9,20)}}};if(rr>0f){pN.alpha=(255*(1f-rr/550f)).toInt().coerceIn(0,255);c.drawCircle(rx,ry,rr,pN);rr+=22f;if(rr>550f)rr=0f}}finally{surfaceHolder.unlockCanvasAndPost(c)}}}}\n' > app/src/main/java/c/m/W.kt
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.4' }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: MatrixCityLiveWallpaper-APK, path: app/build/outputs/apk/debug/app-debug.apk }
