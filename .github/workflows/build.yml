name: Build Matrix Wallpaper APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/example/matrixcity app/src/main/res/xml app/src/main/res/values app/src/main/res/drawable gradle/wrapper

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "MatrixCityLiveWallpaper"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.example.matrixcity'
              compileSdk 34
              defaultConfig { applicationId "com.example.matrixcity"; minSdk 26; targetSdk 34; versionCode 1; versionName "1.0" }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies { implementation 'androidx.core:core-ktx:1.12.0' }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com" package="com.example.matrixcity">
              <uses-feature android:name="android.software.live_wallpaper" android:required="true" />
              <application android:allowBackup="true" android:icon="@drawable/wallpaper_thumbnail" android:label="@string/app_name">
                  <service android:name=".MatrixCityWallpaperService" android:enabled="true" android:exported="true" android:label="@string/wallpaper_label" android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter><action android:name="android.service.wallpaper.WallpaperService" /></intent-filter>
                      <meta-data android:name="android.service.wallpaper" android:resource="@xml/wallpaper" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/wallpaper.xml
          <?xml version="1.0" encoding="utf-8"?>
          <wallpaper xmlns:android="http://android.com" android:description="@string/wallpaper_description" android:thumbnail="@drawable/wallpaper_thumbnail" />
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Matrix City Live Wallpaper</string>
              <string name="wallpaper_label">Matrix City</string>
              <string name="wallpaper_description">Animated Matrix code rain over a cyberpunk city skyline.</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/wallpaper_thumbnail.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://android.com" android:shape="rectangle">
              <gradient android:angle="270" android:endColor="#003B00" android:startColor="#000000" />
              <stroke android:width="4dp" android:color="#00FF41" />
          </shape>
          EOF
          cat << 'EOF' > app/src/main/java/com/example/matrixcity/MatrixCityWallpaperService.kt
          package com.example.matrixcity

          import android.graphics.*
          import android.os.*
          import android.service.wallpaper.WallpaperService
          import android.view.SurfaceHolder
          import kotlin.random.Random

          class MatrixCityWallpaperService : WallpaperService() {
              override fun onCreateEngine(): Engine = MatrixCityEngine()

              inner class MatrixCityEngine : Engine() {
                  private val handler = Handler(Looper.getMainLooper())
                  private var visible = false
                  private var width = 0
                  private var height = 0
                  private val textSize = 36f
                  private var drops = IntArray(0)
                  private val chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*ｦｱｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄ"

                  private val textPaint = Paint().apply { color = Color.parseColor("#00FF41"); this.textSize = 36f; isAntiAlias = true; isFakeBoldText = true }
                  private val headPaint = Paint().apply { color = Color.parseColor("#CCFFCC"); this.textSize = 36f; isAntiAlias = true; isFakeBoldText = true }
                  private val fadePaint = Paint().apply { color = Color.argb(35, 0, 5, 0) }
                  private val cityPaint = Paint().apply { color = Color.parseColor("#050A05"); style = Paint.Style.FILL }
                  private val windowPaint = Paint().apply { color = Color.parseColor("#00AA2B"); style = Paint.Style.FILL }
                  private var buildings = FloatArray(0)

                  private val drawRunner = object : Runnable {
                      override fun run() {
                          drawFrame()
                          if (visible) handler.postDelayed(this, 45L)
                      }
                  }

                  override fun onSurfaceChanged(holder: SurfaceHolder, format: Int, width: Int, height: Int) {
                      super.onSurfaceChanged(holder, format, width, height)
                      this.width = width; this.height = height
                      drops = IntArray((width / textSize).toInt().coerceAtLeast(1)) { Random.nextInt(-30, 0) }
                      buildings = FloatArray(14) { height * Random.nextFloat() * 0.28f + (height * 0.08f) }
                  }

                  override fun onVisibilityChanged(visible: Boolean) {
                      this.visible = visible
                      if (visible) handler.post(drawRunner) else handler.removeCallbacks(drawRunner)
                  }

                  override fun onSurfaceDestroyed(holder: SurfaceHolder) {
                      super.onSurfaceDestroyed(holder)
                      visible = false
                      handler.removeCallbacks(drawRunner)
                  }

                  private fun drawFrame() {
                      var canvas: Canvas? = null
                      try {
                          canvas = surfaceHolder.lockCanvas() ?: return
                          canvas.drawRect(0f, 0f, width.toFloat(), height.toFloat(), fadePaint)
                          for (i in drops.indices) {
                              val x = i * textSize
                              val y = drops[i] * textSize
                              if (y > 0 && y < height) {
                                  canvas.drawText(chars.random().toString(), x, y, headPaint)
                                  if (drops[i] > 1) canvas.drawText(chars.random().toString(), x, (drops[i] - 1) * textSize, textPaint)
                              }
                              if (y > height && Random.nextFloat() > 0.975f) drops[i] = 0
                              drops[i]++
                          }
                          if (buildings.isNotEmpty()) {
                              val bWidth = width.toFloat() / 14
                              for (b in 0 until 14) {
                                  val left = b * bWidth
                                  val top = height - buildings[b]
                                  canvas.drawRect(left, top, left + bWidth + 2f, height.toFloat(), cityPaint)
                                  var winY = top + 20f
                                  while (winY < height - 20f) {
                                      if ((b + winY.toInt()) % 3 == 0) canvas.drawRect(left + bWidth * 0.25f, winY, left + bWidth * 0.45f, winY + 12f, windowPaint)
                                      winY += 32f
                                  }
                              }
                          }
                      } finally {
                          if (canvas != null) surfaceHolder.unlockCanvasAndPost(canvas)
                      }
                  }
              }
          }
          EOF

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MatrixCityLiveWallpaper-APK
          path: app/build/outputs/apk/debug/app-debug.apk
