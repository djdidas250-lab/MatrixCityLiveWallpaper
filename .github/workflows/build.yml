name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p app/src/main/java/c/m app/src/main/res/xml app/src/main/res/values app/src/main/res/drawable
          echo 'pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}};dependencyResolutionManagement{repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS);repositories{google();mavenCentral()}};include ":app"' > settings.gradle
          echo 'plugins{id "com.android.application" version "8.2.2" apply false;id "org.jetbrains.kotlin.android" version "1.9.22" apply false}' > build.gradle
          echo 'android.useAndroidX=true' > gradle.properties
          echo 'plugins{id "com.android.application";id "org.jetbrains.kotlin.android"};android{namespace "c.m";compileSdk 34;defaultConfig{applicationId "com.example.matrix3d";minSdk 26;targetSdk 34;versionCode 4;versionName "6.0"};compileOptions{sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17};kotlinOptions{jvmTarget="17"}};dependencies{implementation "androidx.core:core-ktx:1.12.0"}' > app/build.gradle
          python3 -c 'q=chr(34);e=chr(61);u="ht"+"tp://"+"schemas."+"android."+"com/apk/res/android";x=f"<manifest xmlns:android{e}{q}{u}{q}><uses-feature android:name{e}{q}android.software.live_wallpaper{q} android:required{e}{q}true{q}/><application android:hardwareAccelerated{e}{q}true{q} android:icon{e}{q}@drawable/ic{q} android:label{e}{q}@string/n{q}><activity android:name{e}{q}.MainActivity{q} android:exported{e}{q}true{q}><intent-filter><action android:name{e}{q}android.intent.action.MAIN{q}/><category android:name{e}{q}android.intent.category.LAUNCHER{q}/></intent-filter></activity><service android:name{e}{q}.W{q} android:enabled{e}{q}true{q} android:exported{e}{q}true{q} android:label{e}{q}@string/n{q} android:permission{e}{q}android.permission.BIND_WALLPAPER{q}><intent-filter><action android:name{e}{q}android.service.wallpaper.WallpaperService{q}/></intent-filter><meta-data android:name{e}{q}android.service.wallpaper{q} android:resource{e}{q}@xml/w{q}/></service></application></manifest>";open("app/src/main/AndroidManifest.xml","w").write(x);open("app/src/main/res/xml/w.xml","w").write(f"<wallpaper xmlns:android{e}{q}{u}{q} android:settingsActivity{e}{q}c.m.MainActivity{q} android:thumbnail{e}{q}@drawable/ic{q}/>");open("app/src/main/res/values/strings.xml","w").write(f"<resources><string name{e}{q}n{q}>Matrix 3D</string></resources>");open("app/src/main/res/drawable/ic.xml","w").write(f"<shape xmlns:android{e}{q}{u}{q}><solid android:color{e}{q}#003B00{q}/></shape>")'
          printf 'package c.m\nimport android.app.*;import android.content.*;import android.graphics.*;import android.os.Bundle;import android.widget.*\nclass MainActivity:Activity(){\noverride fun onCreate(b:Bundle?){\nsuper.onCreate(b)\nval p=getSharedPreferences("m",0)\nval r=LinearLayout(this).apply{orientation=1;setBackgroundColor(Color.BLACK);setPadding(64,120,64,64)}\nfun l(s:String)=TextView(this).apply{text=s;setTextColor(Color.GREEN);textSize=18f;typeface=Typeface.MONOSPACE;setPadding(0,32,0,12)}\nval t1=l("SPEED: ${p.getInt("sp",12)}")\nval s1=SeekBar(this).apply{max=28;progress=p.getInt("sp",12)-2;setOnSeekBarChangeListener(object:SeekBar.OnSeekBarChangeListener{override fun onProgressChanged(s:SeekBar?,v:Int,f:Boolean){t1.text="SPEED: ${v+2}";p.edit().putInt("sp",v+2).apply()};override fun onStartTrackingTouch(s:SeekBar?){};override fun onStopTrackingTouch(s:SeekBar?){}})}\nval t2=l("SCALE: ${p.getInt("sz",42)}")\nval s2=SeekBar(this).apply{max=48;progress=p.getInt("sz",42)-20;setOnSeekBarChangeListener(object:SeekBar.OnSeekBarChangeListener{override fun onProgressChanged(s:SeekBar?,v:Int,f:Boolean){t2.text="SCALE: ${v+20}";p.edit().putInt("sz",v+20).apply()};override fun onStartTrackingTouch(s:SeekBar?){};override fun onStopTrackingTouch(s:SeekBar?){}})}\nval btn=Button(this).apply{text="SET 3D WALLPAPER";setBackgroundColor(Color.GREEN);setTextColor(Color.BLACK);setOnClickListener{try{startActivity(Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER).putExtra(WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT,ComponentName(this@MainActivity,W::class.java)))}catch(e:Exception){startActivity(Intent(WallpaperManager.ACTION_LIVE_WALLPAPER_CHOOSER))}}}\nr.addView(l("MATRIX 3D GPU v6"));r.addView(t1);r.addView(s1);r.addView(t2);r.addView(s2);r.addView(btn);setContentView(r)\n}}\n' > app/src/main/java/c/m/MainActivity.kt
          printf 'package c.m\nimport android.content.Context;import android.graphics.*;import android.hardware.*;import android.os.*;import android.service.wallpaper.WallpaperService;import android.view.*;import kotlin.math.*;import kotlin.random.Random\nclass Col(var x:Float,var z:Float,var y:Float,var sp:Float,var ln:Int,val gl:IntArray)\nclass W:WallpaperService(){override fun onCreateEngine()=E();inner class E:Engine(),SensorEventListener{val h=Handler(Looper.getMainLooper());var vis=false;var w=0;var ht=0;var bSz=42f;var ml=1.2f;var rx=-1f;var ry=-1f;var rr=0f;var yw=0f;var pt=0f;var lt=0L;val sm by lazy{getSystemService(Context.SENSOR_SERVICE) as SensorManager};val ch="ｦｱｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789";var cols=ArrayList<Col>();var spG=ArrayList<Bitmap>();var spW=ArrayList<Bitmap>();val p=Paint(Paint.FILTER_BITMAP_FLAG);val pN=Paint(1).apply{color=Color.GREEN;strokeWidth=4f;style=Paint.Style.STROKE};val rn=object:Runnable{override fun run(){dw();if(vis)h.postDelayed(this,16L)}};fun cfg(){val pr=getSharedPreferences("m",0);bSz=pr.getInt("sz",42).toFloat();ml=pr.getInt("sp",12)/10f};fun mkSprites(){if(spG.isNotEmpty())return;val tp=Paint(1).apply{typeface=Typeface.MONOSPACE;isFakeBoldText=true;textSize=54f;textAlign=Paint.Align.CENTER};for(c in ch){val g=c.toString();for(isW in 0..1){val bm=Bitmap.createBitmap(76,76,Bitmap.Config.ARGB_8888);val cv=Canvas(bm);for(d in 8 downTo 1){tp.color=if(isW==1)Color.rgb(20,110+d*10,40)else Color.rgb(0,45+d*14,15+d*4);cv.drawText(g,38f+d*1.3f,56f+d*1.3f,tp)};tp.color=if(isW==1)Color.WHITE else Color.rgb(0,255,75);cv.drawText(g,38f,56f,tp);if(isW==1)spW.add(bm)else spG.add(bm)}}};fun init(){cols.clear();for(i in 0..74){val a=(i/75f)*6.28318f*3f+Random.nextFloat()*0.3f;val rad=0.35f+(i/75f)*1.35f;cols.add(Col(cos(a)*rad,sin(a)*rad,Random.nextFloat()*-50f,0.28f+Random.nextFloat()*0.25f,Random.nextInt(8,18),IntArray(90){Random.nextInt(ch.length)}))}};override fun onSensorChanged(e:SensorEvent){if(e.sensor.type==Sensor.TYPE_GYROSCOPE){if(lt!=0L){val dt=(e.timestamp-lt)*1e-9f;yw+=e.values.getOrElse(1){0f}*dt*1.8f;pt+=e.values.getOrElse(0){0f}*dt*1.4f;pt=pt.coerceIn(-0.85f,0.85f)};lt=e.timestamp}else if(e.sensor.type==Sensor.TYPE_ACCELEROMETER){yw+=(-e.values.getOrElse(0){0f}*0.004f)}};override fun onAccuracyChanged(s:Sensor?,a:Int){};override fun onTouchEvent(e:MotionEvent){if(e.action==0){rx=e.x;ry=e.y;rr=10f};super.onTouchEvent(e)};override fun onSurfaceChanged(hl:SurfaceHolder,f:Int,w:Int,ht:Int){super.onSurfaceChanged(hl,f,w,ht);this.w=w;this.ht=ht;mkSprites();cfg();if(cols.isEmpty())init()};override fun onVisibilityChanged(v:Boolean){super.onVisibilityChanged(v);vis=v;if(v){cfg();val gy=sm.getDefaultSensor(Sensor.TYPE_GYROSCOPE);if(gy!=null)sm.registerListener(this,gy,1)else sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)?.let{sm.registerListener(this,it,1)};h.post(rn)}else{sm.unregisterListener(this);h.removeCallbacks(rn)}};override fun onSurfaceDestroyed(hl:SurfaceHolder){super.onSurfaceDestroyed(hl);vis=false;sm.unregisterListener(this);h.removeCallbacks(rn)};fun dw(){val c=if(Build.VERSION.SDK_INT>=23)surfaceHolder.lockHardwareCanvas()else surfaceHolder.lockCanvas();c?:return;try{c.drawColor(Color.BLACK);yw+=0.003f;pt*=0.96f;val cy=cos(yw);val sy=sin(yw);val hw=w*0.5f;val hh=ht*0.5f;val dst=RectF();val visL=ArrayList<Pair<Float,Col>>(75);for(s in cols){val pv=s.y.toInt();s.y+=s.sp*ml;val cr=s.y.toInt();if(cr!=pv&&cr in s.gl.indices)s.gl[cr]=Random.nextInt(ch.length);val rx3=s.x*cy-s.z*sy;val rz3=s.x*sy+s.z*cy+1.85f;if(rz3>0.25f)visL.add(rz3 to s);if(((cr-s.ln)*bSz)>ht*1.4f){s.y=Random.nextFloat()*-16f;s.ln=Random.nextInt(8,18)}};visL.sortByDescending{it.first};for((rz3,s) in visL){val rx3=s.x*cy-s.z*sy;val sc=1.35f/rz3;val sz=(bSz*sc).coerceIn(10f,110f);val sx=hw+rx3*hw*sc;val br=(1.4f/(0.35f+rz3)).coerceIn(0.18f,1f);val cr=s.y.toInt();for(k in 0..s.ln){val r=cr-k;if(r in s.gl.indices){val sy2=hh+(((r*bSz)-hh)*sc)+(pt*hh*sc);if(sy2>-sz&&sy2<ht+sz){val al=(255*br*(if(k==0)1f else 1f-k.toFloat()/s.ln)).toInt().coerceIn(10,255);p.alpha=al;val hs=sz*0.68f;dst.set(sx-hs,sy2-hs,sx+hs,sy2+hs);val bm=if(k==0)spW[s.gl[r]]else spG[s.gl[r]];c.drawBitmap(bm,null,dst,p)}}}};if(rr>0f){pN.alpha=(255*(1f-rr/600f)).toInt().coerceIn(0,255);c.drawCircle(rx,ry,rr,pN);rr+=24f;if(rr>600f)rr=0f}}finally{surfaceHolder.unlockCanvasAndPost(c)}}}}\n' > app/src/main/java/c/m/W.kt
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.4' }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: MatrixCityLiveWallpaper-APK, path: app/build/outputs/apk/debug/app-debug.apk }
