name: Build Matrix Wallpaper APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Files
        run: |
          mkdir -p app/src/main/java/com/example/matrixcity app/src/main/res/xml app/src/main/res/values app/src/main/res/drawable
          printf 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\ninclude ":app"\n' > settings.gradle
          printf 'plugins { id "com.android.application" version "8.2.2" apply false; id "org.jetbrains.kotlin.android" version "1.9.22" apply false }\n' > build.gradle
          printf 'android.useAndroidX=true\n' > gradle.properties
          printf 'plugins { id "com.android.application"; id "org.jetbrains.kotlin.android" }\nandroid {\n namespace "com.example.matrixcity"; compileSdk 34\n defaultConfig { applicationId "com.example.matrixcity"; minSdk 26; targetSdk 34; versionCode 1; versionName "1.0" }\n compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }\n kotlinOptions { jvmTarget = "17" }\n}\n' > app/build.gradle
          printf '<manifest xmlns:android="http://android.com"><uses-feature android:name="android.software.live_wallpaper" android:required="true" /><application android:icon="@drawable/wallpaper_thumbnail" android:label="@string/app_name"><service android:name=".MatrixCityWallpaperService" android:enabled="true" android:exported="true" android:label="@string/app_name" android:permission="android.permission.BIND_WALLPAPER"><intent-filter><action android:name="android.service.wallpaper.WallpaperService" /></intent-filter><meta-data android:name="android.service.wallpaper" android:resource="@xml/wallpaper" /></service></application></manifest>\n' > app/src/main/AndroidManifest.xml
          printf '<wallpaper xmlns:android="http://android.com" android:thumbnail="@drawable/wallpaper_thumbnail" />\n' > app/src/main/res/xml/wallpaper.xml
          printf '<resources><string name="app_name">Matrix City</string></resources>\n' > app/src/main/res/values/strings.xml
          printf '<shape xmlns:android="http://android.com"><solid android:color="#003B00"/><stroke android:width="4dp" android:color="#00FF41"/></shape>\n' > app/src/main/res/drawable/wallpaper_thumbnail.xml
          printf 'package com.example.matrixcity\nimport android.graphics.*\nimport android.os.*\nimport android.service.wallpaper.WallpaperService\nimport android.view.SurfaceHolder\nimport kotlin.random.Random\nclass MatrixCityWallpaperService : WallpaperService() {\n override fun onCreateEngine(): Engine = MatrixEngine()\n inner class MatrixEngine : Engine() {\n  private val h = Handler(Looper.getMainLooper())\n  private var vis = false; private var w = 0; private var ht = 0; private val sz = 36f\n  private var drops = IntArray(0); private var bldgs = FloatArray(0)\n  private val chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%%&*"\n  private val pTxt = Paint().apply { color = Color.parseColor("#00FF41"); textSize = 36f; isFakeBoldText = true }\n  private val pHead = Paint().apply { color = Color.parseColor("#CCFFCC"); textSize = 36f; isFakeBoldText = true }\n  private val pFade = Paint().apply { color = Color.argb(35, 0, 5, 0) }\n  private val pCity = Paint().apply { color = Color.parseColor("#050A05") }\n  private val pWin = Paint().apply { color = Color.parseColor("#00AA2B") }\n  private val run = object : Runnable { override fun run() { draw(); if (vis) h.postDelayed(this, 45L) } }\n  override fun onSurfaceChanged(holder: SurfaceHolder, f: Int, w: Int, ht: Int) { this.w = w; this.ht = ht; drops = IntArray((w / sz).toInt().coerceAtLeast(1)) { Random.nextInt(-30, 0) }; bldgs = FloatArray(14) { ht * Random.nextFloat() * 0.28f + (ht * 0.08f) } }\n  override fun onVisibilityChanged(v: Boolean) { vis = v; if (v) h.post(run) else h.removeCallbacks(run) }\n  override fun onSurfaceDestroyed(holder: SurfaceHolder) { vis = false; h.removeCallbacks(run) }\n  private fun draw() {\n   val c = surfaceHolder.lockCanvas() ?: return\n   try {\n    c.drawRect(0f, 0f, w.toFloat(), ht.toFloat(), pFade)\n    for (i in drops.indices) { val x = i * sz; val y = drops[i] * sz; if (y > 0 && y < ht) { c.drawText(chars.random().toString(), x, y, pHead); if (drops[i] > 1) c.drawText(chars.random().toString(), x, (drops[i] - 1) * sz, pTxt) }; if (y > ht && Random.nextFloat() > 0.975f) drops[i] = 0; drops[i]++ }\n    if (bldgs.isNotEmpty()) { val bw = w.toFloat() / 14; for (b in 0 until 14) { val l = b * bw; val t = ht - bldgs[b]; c.drawRect(l, t, l + bw + 2f, ht.toFloat(), pCity); var wy = t + 20f; while (wy < ht - 20f) { if ((b + wy.toInt()) %% 3 == 0) c.drawRect(l + bw * 0.25f, wy, l + bw * 0.45f, wy + 12f, pWin); wy += 32f } } }\n   } finally { surfaceHolder.unlockCanvasAndPost(c) }\n  }\n }\n}\n' > app/src/main/java/com/example/matrixcity/MatrixCityWallpaperService.kt
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.4' }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: MatrixCityLiveWallpaper-APK, path: app/build/outputs/apk/debug/app-debug.apk }
