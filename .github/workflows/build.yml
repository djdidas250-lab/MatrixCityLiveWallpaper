name: Build Matrix Wallpaper APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build APK
        run: |
          mkdir -p app/src/main/java/com/example/matrixcity app/src/main/res/xml app/src/main/res/values app/src/main/res/drawable
          printf 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\ninclude ":app"\n' > settings.gradle
          printf 'plugins { id "com.android.application" version "8.2.2" apply false; id "org.jetbrains.kotlin.android" version "1.9.22" apply false }\n' > build.gradle
          printf 'android.useAndroidX=true\n' > gradle.properties
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.example.matrixcity'; compileSdk 34
              defaultConfig { applicationId "com.example.matrixcity"; minSdk 26; targetSdk 34; versionCode 1; versionName "1.0" }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          EOF
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://android.com">
              <uses-feature android:name="android.software.live_wallpaper" android:required="true" />
              <application android:icon="@drawable/wallpaper_thumbnail" android:label="@string/app_name">
                  <service android:name=".MatrixCityWallpaperService" android:enabled="true" android:exported="true" android:label="@string/app_name" android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter><action android:name="android.service.wallpaper.WallpaperService" /></intent-filter>
                      <meta-data android:name="android.service.wallpaper" android:resource="@xml/wallpaper" />
                  </service>
              </application>
          </manifest>
          EOF
          printf '<wallpaper xmlns:android="http://android.com" android:thumbnail="@drawable/wallpaper_thumbnail" />\n' > app/src/main/res/xml/wallpaper.xml
          printf '<resources><string name="app_name">Matrix City</string></resources>\n' > app/src/main/res/values/strings.xml
          printf '<shape xmlns:android="http://android.com"><solid android:color="#003B00"/><stroke android:width="4dp" android:color="#00FF41"/></shape>\n' > app/src/main/res/drawable/wallpaper_thumbnail.xml
          cat << 'EOF' > app/src/main/java/com/example/matrixcity/MatrixCityWallpaperService.kt
          package com.example.matrixcity
          import android.graphics.*
          import android.os.*
          import android.service.wallpaper.WallpaperService
          import android.view.SurfaceHolder
          import kotlin.random.Random
          class MatrixCityWallpaperService : WallpaperService() {
              override fun onCreateEngine(): Engine = MatrixEngine()
              inner class MatrixEngine : Engine() {
                  private val h = Handler(Looper.getMainLooper())
                  private var vis = false; private var w = 0; private var ht = 0; private val sz = 36f
                  private var drops = IntArray(0); private var bldgs = FloatArray(0)
                  private val chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*"
                  private val pTxt = Paint().apply { color = Color.parseColor("#00FF41"); textSize = 36f; isFakeBoldText = true }
                  private val pHead = Paint().apply { color = Color.parseColor("#CCFFCC"); textSize = 36f; isFakeBoldText = true }
                  private val pFade = Paint().apply { color = Color.argb(35, 0, 5, 0) }
                  private val pCity = Paint().apply { color = Color.parseColor("#050A05") }
                  private val pWin = Paint().apply { color = Color.parseColor("#00AA2B") }
                  private val run = object : Runnable { override fun run() { draw(); if (vis) h.postDelayed(this, 45L) } }
                  override fun onSurfaceChanged(holder: SurfaceHolder, f: Int, w: Int, ht: Int) {
                      this.w = w; this.ht = ht
                      drops = IntArray((w / sz).toInt().coerceAtLeast(1)) { Random.nextInt(-30, 0) }
                      bldgs = FloatArray(14) { ht * Random.nextFloat() * 0.28f + (ht * 0.08f) }
                  }
                  override fun onVisibilityChanged(v: Boolean) { vis = v; if (v) h.post(run) else h.removeCallbacks(run) }
                  override fun onSurfaceDestroyed(holder: SurfaceHolder) { vis = false; h.removeCallbacks(run) }
                  private fun draw() {
                      val c = surfaceHolder.lockCanvas() ?: return
                      try {
                          c.drawRect(0f, 0f, w.toFloat(), ht.toFloat(), pFade)
                          for (i in drops.indices) {
                              val x = i * sz; val y = drops[i] * sz
                              if (y > 0 && y < ht) {
                                  c.drawText(chars.random().toString(), x, y, pHead)
                                  if (drops[i] > 1) c.drawText(chars.random().toString(), x, (drops[i] - 1) * sz, pTxt)
                              }
                              if (y > ht && Random.nextFloat() > 0.975f) drops[i] = 0; drops[i]++
                          }
                          if (bldgs.isNotEmpty()) {
                              val bw = w.toFloat() / 14
                              for (b in 0 until 14) {
                                  val l = b * bw; val t = ht - bldgs[b]
                                  c.drawRect(l, t, l + bw + 2f, ht.toFloat(), pCity)
                                  var wy = t + 20f
                                  while (wy < ht - 20f) {
                                      if ((b + wy.toInt()) % 3 == 0) c.drawRect(l + bw * 0.25f, wy, l + bw * 0.45f, wy + 12f, pWin)
                                      wy += 32f
                                  }
                              }
                          }
                      } finally { surfaceHolder.unlockCanvasAndPost(c) }
                  }
              }
          }
          EOF
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.4' }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: MatrixCityLiveWallpaper-APK, path: app/build/outputs/apk/debug/app-debug.apk }
