name: Fix Badges
on: workflow_dispatch
jobs:
  badges:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -c '
          p = chr(104)+chr(116)+chr(116)+chr(112)+chr(115)+chr(58)+chr(47)+chr(47)
          s = p + "img.shields.io/github"
          r = "djdidas250-lab/MatrixCityLiveWallpaper"
          b = f"[![APK Downloads]({s}/downloads/{r}/total?color=00ff55&label=APK%20Downloads&style=for-the-badge)](../../releases/download/v18.0/app-debug.apk) [![Version]({s}/v/release/{r}?color=00cc44&label=Version&style=for-the-badge)](../../releases/download/v18.0/app-debug.apk)"
          text = open("README.md").read()
          old = text.splitlines().pop(3)
          open("README.md", "w").write(text.replace(old, b, 1))
          '
          git config user.name github-actions
          git config user.email actions@github.com
          git add README.md
          git commit -m "Fix-badges"
          git push
