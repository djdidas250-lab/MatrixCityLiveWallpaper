name: Fix README
on: workflow_dispatch
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -c '
          s = "img.shields.io/github"
          g = "://github.com"
          b1 = f"[![APK Downloads](https://{s}/downloads/djdidas250-lab/MatrixCityLiveWallpaper/total?color=00ff55&label=APK%20Downloads&style=for-the-badge)](https://{g}/releases/download/v18.0/app-debug.apk)"
          b2 = f"[![Version](https://{s}/v/release/djdidas250-lab/MatrixCityLiveWallpaper?color=00cc44&label=Version&style=for-the-badge)](https://{g}/releases/download/v18.0/app-debug.apk)"
          dl = f"👉 **[Download Latest APK (Matrix 3D Releases)](https://{g}/releases/download/v18.0/app-debug.apk)**"
          rel = f"**[Releases](https://{g}/releases)**"
          md = f"""# Matrix 3D Live Wallpaper
          **Developer:** Dj DiD@S (`-H@CK the PL@NET-`)

          {b1} {b2}

          {dl}

          A smooth, hardware-accelerated 3D digital rain live wallpaper for Android (8.0+) featuring extruded 3D glyphs, 360° perspective motion tracking, interactive touch physics, and full real-time customization.

          ### Features & Controls
          * **6 Color Themes:** Matrix Green, Cyber Cyan, Crimson Red, Solar Gold, Ultraviolet, and Rainbow Prism.
          * **Real-Time Sliders:** Fall Speed, 3D Glyph Scale, Stream Density, Effect Intensity, and Bloom & Bokeh.
          * **Interactive Toggles:** Lens Bloom & Bokeh, Touch 3D Vortex & Surge, Fold-Adaptive FOV, 3-Axis Rotation Tilt, and Fly-Out 3D Glyphs.

          ### Download & Install
          1. Tap the download link or either green badge above (or go to {rel}) and download **`app-debug.apk`**.
          2. Open the file on your Android phone and allow installation from your browser or Files app if prompted.
          3. Open **Matrix 3D**, customize your settings, and tap **Set 3D Wallpaper**.
          """
          import textwrap
          open("README.md", "w").write(textwrap.dedent(md))
          '
          git config user.name github-actions
          git config user.email actions@github.com
          git add README.md
          git commit -m "Fix README links"
          git push
